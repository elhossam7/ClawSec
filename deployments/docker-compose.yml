version: "3.8"

services:
  secclaw:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: secclaw
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - secclaw-data:/opt/secclaw/data
      - ./secclaw.yaml:/opt/secclaw/secclaw.yaml:ro
      # Mount host logs for monitoring (optional).
      # - /var/log:/var/log:ro
    environment:
      - TZ=UTC
    cap_add:
      - NET_ADMIN
    networks:
      - secclaw-net

volumes:
  secclaw-data:

networks:
  secclaw-net:
    driver: bridge
